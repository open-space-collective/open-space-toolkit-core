# Apache License 2.0

name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: open-space-toolkit-core

jobs:
  prepare-environment:
    name: Prepare Environment Variables
    runs-on: ubuntu-latest
    outputs:
      project_name: ${{ steps.project-name.outputs.value }}
      project_version: ${{ steps.project-version.outputs.value }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - id: project-name
        name: Get Project Name
        run: |
          echo "Project name: ${{ env.PROJECT_NAME }}"
          echo "value=${{ env.PROJECT_NAME }}" >> $GITHUB_OUTPUT
      - id: project-version
        name: Get Project Version
        run: |
          project_version=$(git describe --tags --always)
          echo "Project version: ${project_version}"
          echo "value=${project_version}" >> $GITHUB_OUTPUT

  build-development-image:
    name: Build Development Image
    needs:
      - prepare-environment
    uses: open-space-collective/open-space-toolkit/.github/workflows/build-image.yml@main
    with:
      project_name: ${{ needs.prepare-environment.outputs.project_name }}
      project_version: ${{ needs.prepare-environment.outputs.project_version }}
      target: ci-base
    secrets: inherit

  test:
    name: Test
    needs:
      - prepare-environment
      - build-development-image
    uses: open-space-collective/open-space-toolkit/.github/workflows/test.yml@main
    with:
      project_name: ${{ needs.prepare-environment.outputs.project_name }}
      project_version: ${{ needs.prepare-environment.outputs.project_version }}
    secrets: inherit

  check-abi:
    name: Check ABI Compatibility
    if: github.event_name == 'pull_request'
    needs:
      - prepare-environment
      - build-development-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: openspacecollective/${{ needs.prepare-environment.outputs.project_name }}-development:${{ needs.prepare-environment.outputs.project_version }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check ABI Compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The workspace is owned by the runner user, not the container's root user, and actions/checkout only trusts
          # it during its own step. The clones made by the script need the .git directory trusted too, hence '*'.
          git config --global --add safe.directory '*'

          status=0
          ./tools/check-abi.sh "${BASE_SHA}" HEAD || status=$?

          if [[ ${status} -eq 1 ]]; then
            # Read the title live rather than from the event payload, so that editing it and re-running the job works.
            title=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["title"])')

            if [[ "${title}" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
              echo "::warning::ABI break allowed: the PR title marks a breaking change."
              exit 0
            fi

            echo "::error::ABI break detected. Fix it, or mark the PR title as a breaking change (e.g. 'feat!: ...') and re-run. See the abi-report artifact."
          fi

          exit ${status}
      - name: Upload ABI Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: abi-report
          path: abi-report/
          if-no-files-found: ignore

  package:
    name: Package
    needs:
      - prepare-environment
      - build-development-image
      - test
    uses: open-space-collective/open-space-toolkit/.github/workflows/build-packages.yml@main
    with:
      project_name: ${{ needs.prepare-environment.outputs.project_name }}
      project_version: ${{ needs.prepare-environment.outputs.project_version }}
    secrets: inherit
